services:
  gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command:
      ["./build/message_gateway", "--port", "8080", "--backlog", "65535",
       "--epoll-workers", "8", "--pool-threads", "16", "--queue-capacity", "65536",
       "--rate-limit-capacity", "1000000", "--rate-limit-refill-rate", "0",
       "--storage-directory", "${STORAGE_DIRECTORY:-/tmp/backend-test-storage}"]
    environment:
      GATEWAY_TEST_MODE: "1"
    ports:
      - "8080:8080"
    ulimits:
      nofile:
        soft: 200000
        hard: 200000
    volumes:
      - ../build/backend-test-results:/test-results
      - ../build/backend-test-storage:/tmp/backend-test-storage

  backend-test:
    image: python:3.12-alpine
    depends_on:
      - gateway
    environment:
      CONCURRENCY: ${CONCURRENCY:-100}
      STAGE: ${STAGE:-100}
      GATEWAY_HOST: gateway
      GATEWAY_PORT: 8080
      RESULT_DIR: /results
    ulimits:
      nofile:
        soft: 200000
        hard: 200000
    sysctls:
      net.ipv4.ip_local_port_range: "1024 65535"
    volumes:
      - ../tests/backend_load_stage.py:/backend_load_stage.py:ro
      - ../build/backend-test-results:/results
    command: ["python", "/backend_load_stage.py"]