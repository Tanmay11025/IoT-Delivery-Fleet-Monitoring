services:
  gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command:
      ["./build/message_gateway", "--port", "8080", "--backlog", "128",
       "--epoll-workers", "1", "--pool-threads", "4",
       "--rate-limit-capacity", "1000", "--rate-limit-refill-rate", "0"]
    ulimits:
      nofile:
        soft: 200000
        hard: 200000

  http-test:
    image: python:3.12-alpine
    depends_on:
      - gateway
    environment:
      HTTP_TEST_HOST: gateway
      HTTP_TEST_PORT: 8080
    volumes:
      - ../tests/http_integration_test.py:/http_integration_test.py:ro
    command: ["python", "/http_integration_test.py"]
