name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: Build, unit and integration tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure (Release, warnings are errors)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS=-Werror
      - name: Build
        run: cmake --build build -j"$(nproc)"
      - name: C++ unit tests
        run: ctest --test-dir build --output-on-failure
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest and the SDK
        run: pip install pytest ./python_sdk
      - name: Integration tests (real gateway on local ports)
        run: python -m pytest tests/integration -v

  chaos:
    name: Crash and shutdown tests
    needs: build-and-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build -j"$(nproc)" --target message_gateway
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: kill -9 durability and SIGTERM drain
        run: python -m pytest tests/chaos -v

  sanitizers:
    name: AddressSanitizer + UBSan
    runs-on: ubuntu-24.04
    env:
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v4
      - name: Configure (Debug + sanitizers)
        run: >
          cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - run: cmake --build build-asan -j"$(nproc)"
      - run: ctest --test-dir build-asan --output-on-failure
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: Integration tests against the sanitized gateway
        run: GATEWAY_BINARY=build-asan/message_gateway python -m pytest tests/integration -v

  docker-http:
    name: Docker raw-socket HTTP suite
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/run_http_integration_test.sh
