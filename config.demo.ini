# Demo settings: run the gateway, the dashboard, and examples/fleet_simulator.py
# on one machine.
#
# Every simulated van publishes from the same client IP, and the dashboard
# polls from it too, so the per-IP token bucket is sized for that combined
# traffic: up to ~1,900 vans at 1 report/s plus ~4 dashboard requests/s.
# (One simulator process tops out around 1,500 reports/s anyway.)
# config.example.ini keeps the strict production-style defaults.
port=8080
backlog=1024
epoll_worker_count=0
thread_pool_size=4
task_queue_capacity=1024
rate_limit_capacity=4000
rate_limit_refill_rate=2000
storage_directory=data/log
storage_segment_size=67108864
recent_message_capacity=1024
consumer_port=9090
max_consumers=64
dashboard_directory=dashboard
vehicle_offline_seconds=30
